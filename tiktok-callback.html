<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connected · Sudais Studio Uploader</title><style>
:root{--bg:#ffffff;--fg:#1d1d1f;--muted:#5f6368;--line:#e3e3e3;--link:#1a56db;--box:#f3f4f6}
@media (prefers-color-scheme:dark){:root{--bg:#141414;--fg:#ececec;--muted:#a0a0a0;--line:#2c2c2c;--link:#8ab4f8;--box:#1f1f1f}}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 -apple-system,Segoe UI,Roboto,Arial,sans-serif}
main{max-width:720px;margin:0 auto;padding:40px 20px}
h1{font-size:1.6rem;margin:0 0 .3rem}.sub{color:var(--muted);margin:0 0 2rem}
a{color:var(--link)}nav{border-top:1px solid var(--line);margin-top:2.5rem;padding-top:1rem;color:var(--muted)}
code{display:block;word-break:break-all;background:var(--box);padding:14px;border-radius:8px;font-size:15px}
button{margin-top:12px;font:inherit;padding:10px 18px;border-radius:8px;border:1px solid var(--line);background:var(--box);color:var(--fg);cursor:pointer}
</style></head><body><main><h1>Almost done</h1><p class="sub">Send this code to the Sudais Uploader bot in Telegram to finish connecting.</p>
<div id="ok" hidden><code id="code"></code><button id="copy">Copy</button><p id="msg" class="sub"></p>
<p>Send it as: <b>tiktok ACCOUNT CODE</b> (the bot shows the exact line).</p></div>
<p id="err" hidden>No code was found. Please start the connection again from the bot.</p>
<script>
(function(){
  var q = new URLSearchParams(location.search), c = q.get('code'), s = q.get('state');
  if (!c) { document.getElementById('err').hidden = false; return; }
  document.getElementById('ok').hidden = false;
  document.getElementById('code').textContent = c + (s ? ' ' + s : '');
  document.getElementById('copy').onclick = function(){
    navigator.clipboard.writeText(c + (s ? ' ' + s : '')).then(function(){ document.getElementById('msg').textContent = 'Copied.'; });
  };
})();
</script>
